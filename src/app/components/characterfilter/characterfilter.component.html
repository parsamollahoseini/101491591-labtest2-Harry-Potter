<div class="filter-container">
  <mat-form-field appearance="fill">
    <mat-label>Filter by House</mat-label>
    <mat-select [(ngModel)]="selectedHouse" (selectionChange)="onHouseChange($event)">
      <mat-option *ngFor="let house of houses" [value]="house.value">
        {{ house.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>
